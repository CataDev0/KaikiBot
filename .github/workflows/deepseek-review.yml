name: DeepSeek Code Review on PR

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write # required to post comments

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Write the bot's last review comment (if any) into previous-review.md
      # so the action can track resolved / unresolved issues.
      - name: Fetch previous review
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- deepseek-code-review -->';
            const { data } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, per_page: 100
            });
            const last = data
              .filter(c => c.user.login === 'github-actions[bot]' && c.body?.includes(marker))
              .at(-1);
            fs.writeFileSync('previous-review.md', last ? last.body.replace(marker, '').trim() : '');

      # ↓↓↓ The action: this single step does the review ↓↓↓
      - uses: BitPulse10/deepseek-code-review@v1
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          language: en


      # Read review-result.md, update the old comment or create a new one
      - name: Post / update review comment
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- deepseek-code-review -->';
            const body = fs.readFileSync('review-result.md', 'utf8') + '\n\n' + marker;
            const { data } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, per_page: 100
            });
            const last = data
              .filter(c => c.user.login === 'github-actions[bot]' && c.body?.includes(marker))
              .at(-1);
            if (last) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: last.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body
              });
            } 